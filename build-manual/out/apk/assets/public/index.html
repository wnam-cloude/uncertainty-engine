<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uncertainty Engine</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1A1A2E; color: #F5F0E8; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
h1 { color: #E8D5B7; font-size: 1.8rem; margin-top: 30px; letter-spacing: 0.05em; }
.subtitle { color: #8B8B9E; font-size: 0.8rem; margin-top: 6px; }
.card { background: #252542; border-radius: 12px; padding: 24px; margin-top: 40px; width: 100%; max-width: 360px; text-align: center; }
#question { font-size: 1rem; line-height: 1.5; }
#answer { background: #2D1B3D; border-radius: 12px; padding: 20px; margin-top: 20px; width: 100%; max-width: 360px; font-size: 1.1rem; color: #D4A5D8; text-align: center; display: none; }
button { background: #4A2C5E; color: #F5F0E8; border: none; border-radius: 6px; padding: 12px 40px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 28px; }
button:active { transform: scale(0.97); }
h2 { font-size: 0.8rem; color: #8B8B9E; margin-top: 28px; margin-bottom: 6px; }
#history { font-size: 0.75rem; color: #A09AA8; width: 100%; max-width: 360px; max-height: 180px; overflow-y: auto; padding: 10px; line-height: 1.5; }
</style>
</head>
<body>
<h1>UNCERTAINTY ENGINE</h1>
<p class="subtitle">An oracle for life's unanswerable questions</p>
<div class="card"><div id="question">Tap to ask the void...</div></div>
<div id="answer"></div>
<button onclick="ask()">ASK THE VOID</button>
<h2>HISTORY</h2>
<div id="history"></div>
<script>
const Q=["Will the cat ever return?","Is the soup too hot?","Does the socks drawer eat socks?","Will I forget why I entered this room?","Is the universe a simulation?","Does the fridge light turn off?","Will this bug fix itself?","Is today Tuesday or Thursday?","Does WiFi know when I need it?","Will the package arrive?","Is that noise a ghost?","Does the plant know I talk to it?","Will coffee work before meeting?","Is that shadow moving?","Does USB work first try?","Will alarm wake me?","Are leftovers good?","Does autoplay know my taste?","Will traffic light turn green?","Is this decision reversible?"];
const A=["¯\\_(ツ)_/¯","Maybe.","Ask again later.","The void shrugs.","404: Certainty not found.","Consulting tea leaves...","Probability: unknown.","Reality.exe crashed.","Schrödinger says both.","Loading certainty... ███░░░ 30%","The dice are confused.","Fortune cookie refuses.","Entropy wins.","Ask your local philosopher."];
function ask(){var q=Q[Math.random()*Q.length|0],r=A[Math.random()*A.length|0];document.getElementById('question').textContent=q;document.getElementById('answer').textContent=r;document.getElementById('answer').style.display='block';var e="Q: "+q+"\nA: "+r+"\n";document.getElementById('history').textContent=e+document.getElementById('history').textContent}
</script>
</body>
</html>
