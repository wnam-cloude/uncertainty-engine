<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Uncertainty Engine — Oracle for the Unanswerable</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0b14;--surface:#161225;--card:#1e1833;--border:#2a2245;
  --glow:#7c3aed;--glow-soft:#7c3aed33;--accent:#c084fc;
  --text:#ede9fe;--muted:#7c6f9b;--gold:#fbbf24;
  --font-mono:'Courier New',monospace;--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html,body{height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font-sans)}

/* === VOID BACKGROUND === */
#void-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
#ambient{position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 60% 50% at 50% 40%,#1e1045 0%,transparent 70%),
             radial-gradient(ellipse 40% 30% at 70% 80%,#0f1a30 0%,transparent 60%);
  pointer-events:none}

/* === LAYOUT === */
.app{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:24px 16px 60px}

/* === HEADER === */
.header{text-align:center;margin-top:48px;margin-bottom:8px}
.logo{display:inline-flex;align-items:center;gap:10px}
.orb{width:44px;height:44px;border-radius:50%;
  background:conic-gradient(from 180deg,#7c3aed,#ec4899,#fbbf24,#7c3aed);
  animation:spin 4s linear infinite;position:relative;flex-shrink:0}
.orb::after{content:'';position:absolute;inset:8px;border-radius:50%;
  background:var(--bg);box-shadow:0 0 12px var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:800;letter-spacing:.04em;
  background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.tagline{color:var(--muted);font-size:.82rem;margin-top:8px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-mono)}

/* === ORACLE CARD === */
.oracle-wrap{width:100%;max-width:400px;margin-top:32px;perspective:800px}
.oracle-card{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:32px 28px;text-align:center;position:relative;overflow:hidden;
  box-shadow:0 0 40px rgba(124,58,237,.15),0 20px 60px rgba(0,0,0,.5);
  transition:transform .3s,box-shadow .3s}
.oracle-card:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(124,58,237,.25),0 24px 70px rgba(0,0,0,.6)}
.oracle-card::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);filter:blur(1px)}
.oracle-card::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(124,58,237,.08),transparent 60%);pointer-events:none}

#question{font-size:1.05rem;line-height:1.7;color:var(--text);min-height:60px;
  display:flex;align-items:center;justify-content:center;padding:8px 0;
  font-weight:500;transition:opacity .4s}
#question.fade{opacity:0}

/* answer area */
.answer-area{margin-top:24px;min-height:48px;position:relative}
#answer{font-size:1.15rem;color:var(--accent);font-style:italic;line-height:1.6;
  opacity:0;transform:translateY(8px);transition:all .5s cubic-bezier(.22,1,.36,1)}
#answer.show{opacity:1;transform:translateY(0)}
#answer::before{content:'›';display:inline-block;margin-right:6px;color:var(--gold);font-style:normal}
#answer::after{content:'‹';display:inline-block;margin-left:6px;color:var(--gold);font-style:normal}

/* pulse ring on ask */
.pulse-ring{position:absolute;top:50%;left:50%;width:80px;height:80px;
  border:2px solid var(--accent);border-radius:50%;transform:translate(-50%,-50%) scale(0);
  opacity:0;pointer-events:none}
.pulse-ring.fire{animation:pulse .8s ease-out forwards}
@keyframes pulse{0%{transform:translate(-50%,-50%) scale(.5);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}

/* === BUTTON === */
.ask-btn{margin-top:32px;background:transparent;color:var(--accent);
  border:1px solid var(--glow);border-radius:50px;padding:14px 48px;
  font-size:.95rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;position:relative;overflow:hidden;transition:all .25s;
  font-family:var(--font-sans)}
.ask-btn:hover{background:var(--glow-soft);box-shadow:0 0 30px rgba(124,58,237,.4)}
.ask-btn:active{transform:scale(.96)}
.ask-btn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(192,132,252,.15),transparent);
  transform:translateX(-100%);transition:transform .5s}
.ask-btn:hover::after{transform:translateX(100%)}

/* glitch text effect on button hover */
.ask-btn span{position:relative;z-index:1}

/* === HISTORY === */
.history-section{width:100%;max-width:400px;margin-top:40px}
.section-label{display:flex;align-items:center;gap:10px;margin-bottom:12px;
  font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
  font-family:var(--font-mono)}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.clear-btn{font-size:.65rem;color:var(--muted);cursor:pointer;border:1px solid var(--border);
  background:transparent;padding:3px 10px;border-radius:20px;transition:all .2s;
  font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em}
.clear-btn:hover{border-color:var(--accent);color:var(--accent)}

#history{list-style:none;display:flex;flex-direction:column;gap:8px;max-height:320px;
  overflow-y:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#history::-webkit-scrollbar{width:4px}
#history::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 16px;font-size:.82rem;line-height:1.6;animation:slideIn .35s ease-out;
  transition:border-color .2s}
.hist-item:hover{border-color:rgba(124,58,237,.4)}
.hist-q{color:var(--muted);font-style:italic;margin-bottom:4px;font-size:.78rem}
.hist-a{color:var(--accent)}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* === FOOTER === */
.footer{margin-top:48px;font-size:.65rem;color:var(--muted);text-align:center;
  letter-spacing:.06em;font-family:var(--font-mono);opacity:.6}

/* === RESPONSIVE === */
@media(max-width:420px){.oracle-card{padding:24px 20px}.header{margin-top:32px}}
@media(min-height:800px){.app{justify-content:center}}
</style>
</head>
<body>
<div id="ambient"></div>
<canvas id="void-canvas"></canvas>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="logo"><div class="orb"></div></div>
    <h1>UNCERTAINTY ENGINE</h1>
    <p class="tagline">Oracle for the unanswerable &mdash; est. now</p>
  </div>

  <!-- ORACLE -->
  <div class="oracle-wrap">
    <div class="oracle-card" id="card">
      <div class="pulse-ring" id="ring"></div>
      <div id="question">Tap the void to ask anything…</div>
      <div class="answer-area"><div id="answer"></div></div>
    </div>
    <button class="ask-btn" onclick="ask()" aria-label="Ask the void"><span>&#x272A; ASK THE VOID &#x272A;</span></button>
  </div>

  <!-- HISTORY -->
  <div class="history-section">
    <div class="section-label">History <button class="clear-btn" onclick="clearHist()">Clear</button></div>
    <div id="history"></div>
  </div>

  <p class="footer">results are meaningless by design &#x2014; the universe is indifferent</p>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────
const QUESTIONS=[
  "Will the cat ever come back?",
  "Is the soup actually edible or am I just hungry?",
  "Does the socks drawer consume socks intentionally?",
  "Will I forget why I walked into this room?",
  "Is reality a simulation running on outdated hardware?",
  "Did I lock the door or just strongly intend to?",
  "Will this bug fix itself if I ignore it long enough?",
  "Is today Tuesday or some kind of spiritual crisis?",
  "Does the WiFi know when I need it most?",
  "Will the package arrive before I stop caring?",
  "Was that noise a ghost or just the house settling?",
  "Does my plant judge me silently?",
  "Will coffee actually work or is it placebo at this point?",
  "Is that shadow moving on its own accord?",
  "Why does USB always take three attempts?",
  "Will the alarm wake me or will I smudge it?",
  "Are leftovers still good or is that optimism?",
  "Does autoplay understand me better than I understand myself?",
  "Will the green light last long enough?",
  "Is this decision reversible in any timeline?",
  "Am I the main character or an NPC in someone else's story?",
  "Will I remember this password next time?",
  "Is procrastination just strategic delay?",
  "Do shadows have mass?",
  "Will the printer work when I need it most?",
  "Is silence just sound at a frequency I can't hear?",
  "Will I be proud of this in five years?",
  "Does the universe owe me anything?",
  "Am I being too hard on myself about nothing?",
  "Will the moon remember me?",
  "Is confusion a state of mind or a feature?",
  "Did I close the app or did the app close me?",
  "Is there a version of me who made better choices?",
  "Will tomorrow be different from today?",
  "Does the void blink back?",
  "Is entropy fashionable right now?",
  "Will I find the other earring?",
  "Are dreams just background defrag?",
  "Does the fridge hum in a key?",
  "Is 'soon' a real timeframe?",
  "Will the toast land butter-side up?",
  "Am I ready for what's next or just hoping?",
  "Does 'meh' count as an emotion?"
];

const ANSWERS=[
  "The void shrugs.",
  "404: Certainty not found.",
  "Probability matrix corrupted. Try again.",
  "Schrödinger says both, actually.",
  "Reality.exe encountered an unexpected emotion.",
  "Consulting tea leaves… they say maybe.",
  "Entropy wins. But beautifully.",
  "Ask again later. The stars are busy.",
  "The oracle is buffering… ████░░ 67%",
  "Fortune cookie factory strike. No answer.",
  "Universe is on lunch break. Returns at 3.",
  "Error 418: I'm a teapot.",
  "This question has no valid answer.",
  "The dice are confused.",
  "Maybe. But confidently so.",
  "Depends. On everything.",
  "I would tell you, but I signed an NDA with causality.",
  "The cosmic hum suggests: proceed anyway.",
  "No. But \"no\" is also an answer.",
  "Your local philosopher recommends patience.",
  "Signs point to yes, but the signs are unreliable.",
  "The void whispers: *you already know*",
  "Absolutely not. Or yes. Hard to say.",
  "Ask your future self. They'll dodge it too.",
  "The numbers say ∞",
  "Have you tried turning it off and on?",
  "The algorithm is feeling uncertain too.",
  "In another timeline, yes. This one less so.",
  "The answer is encoded in static.",
  "Only time will tell. And time is late.",
  "My sources say: probably not, but interestingly so."
];

// ── STATE ───────────────────────────────────────────────────────────────
let asking=false;
let qIdx=[], aIdx=[]; // shuffled indices to avoid repeats

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*i+1|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function pick(qArr,aArr){
  if(!qIdx.length||qIdx[0]>=qArr.length){qIdx=shuffle([...Array(qArr.length).keys()])}
  if(!aIdx.length||aIdx[0]>=aArr.length){aIdx=shuffle([...Array(aArr.length).keys()])}
  return[qArr[qIdx.shift()],aArr[aIdx.shift()]]
}

// ── HISTORY (localStorage) ──────────────────────────────────────────────
const KEY='ue_history';
function loadHist(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function saveHist(h){localStorage.setItem(KEY,JSON.stringify(h.slice(0,50)))}
function renderHist(){
  const el=document.getElementById('history');
  const h=loadHist();
  el.innerHTML=h.length?h.map(([q,a])=>`<li class="hist-item"><div class="hist-q">"${q}"</div><div class="hist-a">${esc(a)}</div></li>`).join('')
    :'Your queries will appear here.';
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function clearHist(){localStorage.removeItem(KEY);renderHist()}
renderHist();

// ── ASK ─────────────────────────────────────────────────────────────────
function ask(){
  if(asking)return;asking=true;
  const[Q,A]=pick(QUESTIONS,ANSWERS);
  const qEl=document.getElementById('question');
  const aEl=document.getElementById('answer');
  const ring=document.getElementById('ring');
  // fade out question
  qEl.classList.add('fade');
  aEl.classList.remove('show');
  // pulse
  ring.classList.remove('fire');void ring.offsetWidth;ring.classList.add('fire');
  setTimeout(()=>{
    qEl.textContent=Q;qEl.classList.remove('fade');
    aEl.textContent=A;aEl.classList.add('show');
    const h=loadHist();h.unshift([Q,A]);saveHist(h);renderHist();
    asking=false;
  },400);
}

// ── PARTICLES ───────────────────────────────────────────────────────────
const cvs=document.getElementById('void-canvas');
const ctx=cvs.getContext('2d');
let W,H,particles=[];
function resize(){cvs.width=W=cvs.offsetWidth;cvs.height=H=cvs.offsetHeight}
window.addEventListener('resize',resize);resize();
class P{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*W;this.y=Math.random()*H;
    this.r=Math.random()*1.5+.3;this.vx=(Math.random()-.5)*.25;
    this.vy=-Math.random()*.4-.1;this.alpha=Math.random()*.5+.1;
    this.life=Math.random()*200+100}
  update(){this.x+=this.vx;this.y+=this.vy;this.life--;
    if(this.life<=0||this.y<-10||this.x<-10||this.x>W+10)this.reset(),this.y=H+5}
  draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(192,132,252,${this.alpha})`;ctx.fill()}
}
for(let i=0;i<50;i++)particles.push(new P);
(function loop(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw()});requestAnimationFrame(loop)})();

// ── INIT ────────────────────────────────────────────────────────────────
document.getElementById('question').textContent=QUESTIONS[Math.random()*QUESTIONS.length|0];
</script>
</body>
</html>
